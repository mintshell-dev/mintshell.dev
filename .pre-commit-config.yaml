repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (quét secret)
        entry: gitleaks git --pre-commit --redact --staged --verbose
        language: system
        pass_filenames: false
      - id: prettier
        name: prettier (kiểm định dạng)
        # Chặn commit file lệch định dạng; dùng prettier có sẵn, không thêm dependency.
        # --ignore-unknown bỏ qua phần mở rộng prettier không hỗ trợ.
        entry: pnpm exec prettier --check --ignore-unknown
        language: system
        pass_filenames: true
      - id: no-notion-import
        name: chặn nháp Notion (content/writeups/_import/)
        # Nháp kéo bằng `pnpm notion:pull` có thể còn flag/IP/tên máy chưa che. .gitignore chặn
        # `git add`, hook này chặn cả `git add -f` (ADR 0013).
        entry: nháp Notion trong content/writeups/_import/ không bao giờ được commit (ADR 0013)
        language: fail
        files: ^content/writeups/_import/
