packages:
  - apps/*
  - packages/*

# Chỉ cài phiên bản đã phát hành ít nhất 1 ngày (tính bằng phút).
# Khai báo tường minh để pnpm bật minimumReleaseAgeStrict: gói quá mới sẽ bị chặn,
# không bị lặng lẽ thêm vào danh sách loại trừ.
minimumReleaseAge: 1440

# Từ chối cài khi Node không khớp trường engines.
engineStrict: true

# Mặc định pnpm KHÔNG chạy install script của dependency.
# Chỉ thêm `true` cho gói thật sự cần, kèm lý do. Hiện chưa gói nào cần.
allowBuilds:
  # postinstall chỉ kiểm tra/tải lại binary; binary đã có qua optionalDependencies theo nền tảng.
  esbuild: false

# Phiên bản ghim chính xác, dùng chung cho mọi package qua `catalog:`.
catalog:
  '@astrojs/check': 0.9.10
  '@astrojs/mdx': 8.0.2
  '@eslint/js': 10.0.1
  '@fontsource/be-vietnam-pro': 5.3.0
  '@fontsource/jetbrains-mono': 5.3.0
  '@types/node': 24.19.1
  astro: 7.3.5
  eslint: 10.11.0
  eslint-plugin-astro: 3.2.1
  prettier: 3.9.9
  prettier-plugin-astro: 1.1.0
  turbo: 2.11.6
  typescript: 6.0.3
  typescript-eslint: 8.71.0
  vitest: 5.0.3
